name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build (Release, unsigned)
        run: |
          xcodebuild -project WeatherGZ.xcodeproj \
            -scheme WeatherGZ \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Ad-hoc sign with entitlements & package IPA
        run: |
          APP=dd/Build/Products/Release-iphoneos/WeatherGZ.app
          codesign --force --sign - --timestamp=none \
            --entitlements Widget/WeatherGZWidget.entitlements \
            "$APP/PlugIns/WeatherGZWidget.appex"
          codesign --force --sign - --timestamp=none \
            --entitlements App/WeatherGZ.entitlements \
            "$APP"
          codesign --verify --deep --strict "$APP" || true
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr WeatherGZ.ipa Payload
          ls -la WeatherGZ.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: WeatherGZ-ipa
          path: WeatherGZ.ipa
