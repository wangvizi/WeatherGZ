name: WeatherGZ
options:
  bundleIdPrefix: cn.guizhou
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
targets:
  WeatherGZ:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - Assets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.guizhou.weathergz
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: App/WeatherGZ.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: WeatherGZWidget
  WeatherGZWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.guizhou.weathergz.widget
        INFOPLIST_FILE: Widget/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: Widget/WeatherGZWidget.entitlements
        SKIP_INSTALL: true
